services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # live code reload in dev

  # Local Postgres used ONLY by pytest. Dev data lives on Supabase.
  db-test:
    image: postgres:16
    ports:
      - "5433:5432"  # host port 5433 so it never clashes with a local Postgres on 5432
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 15
